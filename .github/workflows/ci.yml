name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate pinned fediverse-pasture composition
        env:
          ACTIVITYPUB_ENV_FILE: ${{ github.workspace }}/.env.example
          AP_VAULT_TOKEN_FILE: /dev/null
        run: bash eng/pasture.sh config
      - name: Install .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install frontend Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            frontend/misskey-v12/package-lock.json
            tests/frontend-blazor-e2e/package-lock.json
      - name: Restore locked frontend dependencies
        working-directory: frontend/misskey-v12
        run: npm ci --ignore-scripts
      - name: Frontend type, unit, build, vulnerability, and license gates
        run: |
          npm --prefix frontend/misskey-v12 run typecheck
          npm --prefix frontend/misskey-v12 test
          npm --prefix frontend/misskey-v12 run verify:upstream
          npm --prefix frontend/misskey-v12 run build
          npm --prefix frontend/misskey-v12 audit --audit-level=high
          node eng/check-frontend-licenses.mjs
      - name: Fixed-version API inventory completeness
        run: bash eng/api-inventory.sh check
      - name: Dolphin backend contract inventory completeness
        run: node eng/generate-dolphin-contract.mjs --check
      - name: Misskey frontend inventory completeness
        run: |
          npm --prefix frontend/misskey-v12 run inventory:check
          npm --prefix frontend/misskey-v12 run blazor:styles:check
          npm --prefix frontend/misskey-v12 run blazor:emoji-data:check
          npm --prefix frontend/misskey-v12 run blazor:locales:check
          npm --prefix frontend/misskey-v12 run blazor:mfm:check
          npm --prefix frontend/misskey-v12 run blazor:matter:check
          node eng/generate-blazor-themes.mjs --check
      - name: Restore locked dependencies
        run: dotnet restore ActivityPubServer.slnx --locked-mode
      - name: Restore repository tools
        run: dotnet tool restore
      - name: Format gate
        run: dotnet format ActivityPubServer.slnx --verify-no-changes --no-restore
      - name: Release build
        run: dotnet build ActivityPubServer.slnx --configuration Release --no-restore
      - name: Unit, integration, security, and migration tests
        run: dotnet test ActivityPubServer.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=tests"
      - name: Restore Blazor browser-test dependencies
        working-directory: tests/frontend-blazor-e2e
        run: npm ci --ignore-scripts
      - name: Install pinned browser engines and system dependencies
        working-directory: tests/frontend-blazor-e2e
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Opaque-background browser regression gate
        working-directory: tests/frontend-blazor-e2e
        run: npm run test:background
      - name: Misskey 12 upstream DOM and interaction parity gate
        working-directory: tests/frontend-blazor-e2e
        run: npm run test:upstream-dom
      - name: NuGet vulnerability audit
        run: dotnet list ActivityPubServer.slnx package --vulnerable --include-transitive --no-restore
      - name: License policy
        run: bash eng/check-licenses.sh | tee dependency-licenses.tsv
      - name: Generate migration review script
        run: >-
          dotnet ef migrations script --no-build --configuration Release
          --project src/ActivityPub.Persistence --startup-project src/ActivityPub.Persistence
          --output migrations.sql
      - name: Upload test and migration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-test-evidence
          path: |
            **/TestResults/*.trx
            tests/frontend-blazor-e2e/artifacts/
            dependency-licenses.tsv
            migrations.sql

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container
        run: docker build --tag activitypub-server:ci .
      - name: Verify non-root runtime and media tools
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --entrypoint /bin/sh activitypub-server:ci
          -ec 'test "$$(id -u)" != 0; ffmpeg -version >/dev/null; curl --version >/dev/null'
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: activitypub-server:ci
          format: spdx-json
          output-file: activitypub-server.spdx.json
      - name: Scan container
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: activitypub-server:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: activitypub-server-sbom
          path: activitypub-server.spdx.json

  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan lock files with OSV
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            .
