services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    volumes:
      - ./deploy/chaos/toxiproxy.json:/config/toxiproxy.json:ro
    networks:
      activitypub:
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    depends_on:
      toxiproxy:
        condition: service_started
    environment:
      ConnectionStrings__ActivityPub: Host=toxiproxy;Port=15432;Database=activitypub;Username=activitypub;Password=${AP_POSTGRES_PASSWORD:?set AP_POSTGRES_PASSWORD};Timeout=5;Command Timeout=10
      VaultTransit__Address: http://toxiproxy:18200
      Media__ServiceUrl: http://toxiproxy:19000
      Media__ClamAvHost: toxiproxy
      Media__ClamAvPort: "13310"

  worker:
    depends_on:
      toxiproxy:
        condition: service_started
    environment:
      ConnectionStrings__ActivityPub: Host=toxiproxy;Port=15432;Database=activitypub;Username=activitypub;Password=${AP_POSTGRES_PASSWORD:?set AP_POSTGRES_PASSWORD};Timeout=5;Command Timeout=10
      VaultTransit__Address: http://toxiproxy:18200
      Media__ServiceUrl: http://toxiproxy:19000
      Media__ClamAvHost: toxiproxy
      Media__ClamAvPort: "13310"
