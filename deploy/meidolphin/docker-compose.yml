services:
  meidolphin:
    image: node:18-alpine
    restart: unless-stopped
    working_dir: /dolphin
    command: sh -c "node index.js"
    ports:
      - "127.0.0.1:3211:3000"
    volumes:
      - /root/new-project/.cache/meidolphin:/dolphin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meidolphin

  redis:
    restart: unless-stopped
    image: redis:4.0-alpine
    networks:
      - meidolphin
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    restart: unless-stopped
    image: postgres:11-alpine
    environment:
      POSTGRES_DB: dolphin
      POSTGRES_USER: dolphin
      POSTGRES_PASSWORD: dolphin-password
    networks:
      - meidolphin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolphin"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  meidolphin:
    name: meidolphin
