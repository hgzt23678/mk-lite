# Presentation port for Keycloak 26.7.0. Authentication still posts only to Keycloak's
# loginAction. The source visual contract is Misskey 12.119.2, commit
# a5a74f4434b179cdb1f97af98bf294c8b18de0e2.
parent=base
import=common/keycloak
locales=ja,en
meta=viewport==width=device-width,initial-scale=1,viewport-fit=cover
styles=vendor/fontawesome/css/all.min.css css/misskey-v12-default-theme.css css/misskey-v12-upstream.css css/keycloak-misskey-v12.css
scripts=js/misskey-signin.js

# Safe fallback classes for Keycloak pages that are not credential-entry steps. The login,
# username, password, OTP and WebAuthn pages override their DOM explicitly below this theme.
kcFormClass=mk-keycloak-fallback-form
kcFormGroupClass=mk-keycloak-fallback-group
kcFormGroupErrorClass=mk-keycloak-fallback-error
kcLabelClass=mk-keycloak-fallback-label
kcLabelWrapperClass=mk-keycloak-fallback-label-wrapper
kcInputClass=mk-keycloak-fallback-input
kcInputErrorMessageClass=mk-keycloak-field-error
kcInputGroup=mk-keycloak-fallback-input-group
kcInputWrapperClass=mk-keycloak-fallback-input-wrapper
kcFormOptionsClass=mk-keycloak-fallback-options
kcFormOptionsWrapperClass=mk-keycloak-fallback-options-wrapper
kcFormButtonsClass=mk-keycloak-fallback-buttons
kcButtonClass=bghgjjyj _button
kcButtonPrimaryClass=primary
kcButtonDefaultClass=
kcButtonBlockClass=full
kcButtonLargeClass=
kcAlertClass=mk-auth-global-feedback
kcAlertTitleClass=mk-auth-global-feedback__text
kcFormPasswordVisibilityButtonClass=_button password-toggle
kcFormPasswordVisibilityIconShow=fas fa-eye
kcFormPasswordVisibilityIconHide=fas fa-eye-slash
kcSelectAuthListClass=mk-keycloak-authenticator-list
kcSelectAuthListItemClass=mk-keycloak-authenticator
kcSelectAuthListItemTitleClass=mk-keycloak-authenticator__title
kcSelectAuthListItemDescriptionClass=mk-keycloak-authenticator__description
kcLoginOTPListClass=mk-keycloak-otp-choice
kcLoginOTPListInputClass=mk-keycloak-otp-choice__input
kcLoginOTPListItemHeaderClass=mk-keycloak-otp-choice__header
kcLoginOTPListItemTitleClass=mk-keycloak-otp-choice__title
